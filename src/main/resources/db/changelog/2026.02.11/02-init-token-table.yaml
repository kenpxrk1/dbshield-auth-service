databaseChangeLog:
  - changeSet:
        id: 002-create-token-table
        author: shield-auth
        changes:
          - createTable:
              tableName: token
              columns:
                - column:
                    name: id
                    type: BIGSERIAL
                    constraints:
                      primaryKey: true
                      primaryKeyName: pk_token

                - column:
                    name: refresh_token
                    type: UUID
                    constraints:
                      nullable: false
                      unique: true
                      uniqueConstraintName: uk_token_refresh_token

                - column:
                    name: expire_time
                    type: TIMESTAMP WITH TIME ZONE
                    constraints:
                      nullable: false

                - column:
                    name: is_revoked
                    type: BOOLEAN
                    defaultValueBoolean: false
                    constraints:
                      nullable: false

                - column:
                    name: user_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: created_at
                    type: TIMESTAMP WITH TIME ZONE
                    constraints:
                      nullable: false

                - column:
                    name: updated_at
                    type: TIMESTAMP WITH TIME ZONE
                    constraints:
                      nullable: false

          - addForeignKeyConstraint:
              baseTableName: token
              baseColumnNames: user_id
              constraintName: fk_token_user
              referencedTableName: user
              referencedColumnNames: id
              onDelete: CASCADE